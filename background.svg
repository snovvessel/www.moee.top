<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- 月夜远山 · 深色背景图（程序化生成，可自由替换为自己的照片） -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c12"/>
      <stop offset=".55" stop-color="#12161f"/>
      <stop offset="1" stop-color="#1a2130"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4ecd8" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#f4ecd8" stop-opacity=".10"/>
      <stop offset="1" stop-color="#f4ecd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0de"/>
      <stop offset="1" stop-color="#d8d1bd"/>
    </linearGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#e9e3d5">
    <circle cx="110" cy="120" r="1.7" opacity=".75"/>
    <circle cx="300" cy="60"  r="1.2" opacity=".5"/>
    <circle cx="470" cy="180" r="1.5" opacity=".6"/>
    <circle cx="640" cy="90"  r="1.1" opacity=".45"/>
    <circle cx="820" cy="150" r="1.6" opacity=".65"/>
    <circle cx="980" cy="70"  r="1.2" opacity=".5"/>
    <circle cx="1520" cy="120" r="1.5" opacity=".55"/>
    <circle cx="1420" cy="320" r="1.2" opacity=".45"/>
    <circle cx="170" cy="330" r="1.3" opacity=".5"/>
    <circle cx="520" cy="300" r="1.1" opacity=".4"/>
    <circle cx="760" cy="260" r="1.5" opacity=".55"/>
    <circle cx="1120" cy="290" r="1.2" opacity=".5"/>
    <circle cx="220" cy="520" r="1.1" opacity=".35"/>
    <circle cx="900" cy="440" r="1.3" opacity=".4"/>
    <circle cx="1350" cy="500" r="1.2" opacity=".35"/>
    <circle cx="60" cy="220"  r="1.4" opacity=".6"/>
  </g>

  <!-- 月亮光晕 + 月亮（右上） -->
  <circle cx="1255" cy="205" r="210" fill="url(#halo)"/>
  <circle cx="1255" cy="205" r="74" fill="url(#moon)"/>
  <circle cx="1232" cy="186" r="10" fill="#fff" opacity=".28"/>
  <circle cx="1270" cy="230" r="6"  fill="#fff" opacity=".2"/>

  <!-- 远山三叠 -->
  <path d="M0 755 Q170 690 360 735 T700 715 T1060 745 T1380 720 L1600 745 L1600 1000 L0 1000 Z" fill="#1b2333"/>
  <path d="M0 830 Q240 765 500 805 T980 790 T1380 815 L1600 800 L1600 1000 L0 1000 Z" fill="#131726"/>
  <path d="M0 905 Q320 855 640 895 T1240 870 L1600 900 L1600 1000 L0 1000 Z" fill="#0d1019"/>
</svg>
